<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAGER HUB PRO</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        body { background: #121212; color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; padding-bottom: 180px; }
        .orange { color: #FF7900; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

        .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 10px; scrollbar-width: none; }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip { background: #2A2A2A; padding: 8px 16px; border-radius: 20px; font-size: 13px; white-space: nowrap; border: 1px solid #444; cursor: pointer; }
        .filter-chip.active { background: #FF7900; border-color: #FF7900; color: white; font-weight: bold; }

        .card { background: #1E1E1E; border-radius: 22px; padding: 15px; border: 1px solid #333; }
        .task-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #2A2A2A; }

        /* Priorités */
        .priority-P1 { border-left: 4px solid #ff4444; padding-left: 10px; }
        .priority-P2 { border-left: 4px solid #FF7900; padding-left: 10px; }
        .priority-P3 { border-left: 4px solid #444; padding-left: 10px; }

        .checkbox { width: 28px; height: 28px; border: 2px solid #FF7900; border-radius: 9px; flex-shrink: 0; cursor: pointer; }
        .checkbox.done { background: #FF7900; display: flex; align-items: center; justify-content: center; }

        .footer-form { position: fixed; bottom: 0; left: 0; right: 0; background: #1E1E1E; padding: 15px; border-top: 1px solid #333; z-index: 100; }
        .input-row { display: flex; gap: 8px; margin-bottom: 8px; }
        input, select { background: #2A2A2A; border: 1px solid #444; color: white; padding: 12px; border-radius: 12px; font-size: 14px; width: 100%; }

        button.add-btn { background: #FF7900; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; }
        button.archive-btn { background: #333; color: #999; border: none; padding: 5px 10px; border-radius: 8px; font-size: 11px; }

        .badge { font-size: 10px; background: #333; padding: 4px 8px; border-radius: 6px; color: #FF7900; margin-top: 5px; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabaseClient = window.supabase.createClient('https://phqdtypbrwxngqdjgoud.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocWR0eXBicnd4bmdxZGpnb3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNDQwMzgsImV4cCI6MjA4NjgyMDAzOH0.P69E3eB36Mcur7lmg-EWxwwwI6lKLbcDCnKXDrHDEHY');

        const STAFF = ["Steeve", "Mathieu", "Yannis", "Amaury", "Elliot", "Irvan", "Emrecan", "Ludovyk", "Johan", "Lucas", "Nico", "Jean-Max"];

        function App() {
            const [tasks, setTasks] = useState([]);
            const [text, setText] = useState('');
            const [date, setDate] = useState('');
            const [priority, setPriority] = useState('P3');
            const [filter, setFilter] = useState('TOUS');
            const [showHistory, setShowHistory] = useState(false);
            const [currentUser, setCurrentUser] = useState(localStorage.getItem('manager_name') || '');

            useEffect(() => {
                if (!currentUser) {
                    const name = prompt("Qui utilise l'application ?");
                    if (name) { localStorage.setItem('manager_name', name); setCurrentUser(name); }
                }
                fetchTasks();
                const ch = supabaseClient.channel('db').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>fetchTasks()).subscribe();
                return () => supabaseClient.removeChannel(ch);
            }, [currentUser, showHistory]);

            async function fetchTasks() {
                let query = supabaseClient.from('tasks').select('*');
                // Filtre selon si on veut l'historique ou les tâches en cours
                query = query.eq('is_done', showHistory);

                const { data } = await query;
                if (data) {
                    const sorted = data.sort((a, b) => {
                        // Tri par priorité (P1 en haut) puis par date
                        if (a.priority !== b.priority) return a.priority.localeCompare(b.priority);
                        if (!a.due_date) return 1;
                        if (!b.due_date) return -1;
                        return new Date(a.due_date) - new Date(b.due_date);
                    });
                    setTasks(sorted);
                }
            }

            async function addTask(assignedTo = null) {
                if (!text.trim()) return;
                const payload = {
                    text: text,
                    is_done: false,
                    assigned_to: assignedTo || null,
                    due_date: date || null,
                    priority: priority,
                    created_by: currentUser
                };
                await supabaseClient.from('tasks').insert([payload]);
                setText(''); setDate(''); setPriority('P3');
            }

            async function toggleTask(task) {
                const { error } = await supabaseClient.from('tasks').update({
                    is_done: !task.is_done,
                    last_updated_by: currentUser,
                    completed_at: task.is_done ? null : new Date().toISOString()
                }).eq('id', task.id);
            }

            const filteredTasks = filter === 'TOUS'
                ? tasks
                : tasks.filter(t => t.assigned_to === filter || t.text.includes(filter));

            return (
                <div className="container">
                    <div className="header">
                        <h2 style={{margin:0, fontSize:18}}>
                            {showHistory ? "HISTORIQUE" : "MISSIONS"} <span className="orange">HUB</span>
                        </h2>
                        <button className="archive-btn" onClick={() => setShowHistory(!showHistory)}>
                            {showHistory ? "⬅ Voir en cours" : "📁 Historique"}
                        </button>
                    </div>

                    <div className="filter-bar">
                        <div className={`filter-chip ${filter === 'TOUS' ? 'active' : ''}`} onClick={() => setFilter('TOUS')}>Tous</div>
                        {STAFF.map(s => (
                            <div key={s} className={`filter-chip ${filter === s ? 'active' : ''}`} onClick={() => setFilter(s)}>{s}</div>
                        ))}
                    </div>

                    <div className="card">
                        {filteredTasks.length === 0 ? (
                            <div style={{textAlign:'center', color:'#666', padding:20}}>Vide.</div>
                        ) : (
                            filteredTasks.map(t => (
                                <div key={t.id} className={`task-item priority-${t.priority || 'P3'}`}>
                                    <div className={`checkbox ${t.is_done ? 'done' : ''}`} onClick={() => toggleTask(t)}>
                                        {t.is_done && "✓"}
                                    </div>
                                    <div style={{flex:1}}>
                                        <div style={{fontSize:15, textDecoration: t.is_done ? 'line-through' : 'none', color: t.is_done ? '#666' : 'white'}}>
                                            {t.text}
                                        </div>
                                        <div style={{display:'flex', flexWrap:'wrap'}}>
                                            {t.due_date && <span className="badge">📅 {new Date(t.due_date).toLocaleDateString()}</span>}
                                            {t.assigned_to && <span className="badge" style={{background:'#2A2A2A'}}>👤 {t.assigned_to}</span>}
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    {!showHistory && (
                        <div className="footer-form">
                            <div className="input-row">
                                <input type="text" placeholder="Nouvelle mission..." value={text} onChange={e => setText(e.target.value)} />
                                <select style={{width:'100px'}} value={priority} onChange={e => setPriority(e.target.value)}>
                                    <option value="P1">🔴 Urgent</option>
                                    <option value="P2">🟠 Important</option>
                                    <option value="P3">⚪ Normal</option>
                                </select>
                            </div>
                            <div className="input-row">
                                <input type="date" value={date} onChange={e => setDate(e.target.value)} />
                                <select onChange={(e) => { if(e.target.value) { addTask(e.target.value); e.target.value = ""; } }}>
                                    <option value="">👤 Assigner à...</option>
                                    {STAFF.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                                <button className="add-btn" onClick={() => addTask()} style={{width:'80px'}}>OK</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
