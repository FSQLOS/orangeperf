<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAGER HUB PRO</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        body { background: #121212; color: white; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; padding-bottom: 180px; }
        .orange { color: #FF7900; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 10px; scrollbar-width: none; }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-chip { background: #2A2A2A; padding: 8px 16px; border-radius: 20px; font-size: 13px; white-space: nowrap; border: 1px solid #444; cursor: pointer; transition: 0.2s; }
        .filter-chip.active { background: #FF7900; border-color: #FF7900; color: white; font-weight: bold; }

        .card { background: #1E1E1E; border-radius: 22px; padding: 15px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .task-item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #2A2A2A; }

        /* Priorités visuelles */
        .priority-P1 { border-left: 4px solid #ff4444; padding-left: 12px; }
        .priority-P2 { border-left: 4px solid #FF7900; padding-left: 12px; }
        .priority-P3 { border-left: 4px solid #444; padding-left: 12px; }

        .checkbox { width: 28px; height: 28px; border: 2px solid #FF7900; border-radius: 9px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .checkbox.done { background: #FF7900; color: white; }

        .footer-form { position: fixed; bottom: 0; left: 0; right: 0; background: #1E1E1E; padding: 15px; border-top: 1px solid #333; z-index: 100; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .input-row { display: flex; gap: 8px; margin-bottom: 8px; }
        input, select { background: #2A2A2A; border: 1px solid #444; color: white; padding: 12px; border-radius: 12px; outline: none; font-size: 15px; width: 100%; -webkit-appearance: none; }

        button.add-btn { background: #FF7900; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.add-btn:active { opacity: 0.7; transform: scale(0.98); }
        button.history-btn { background: #333; color: #999; border: 1px solid #444; padding: 6px 12px; border-radius: 10px; font-size: 12px; cursor: pointer; }

        .badge { font-size: 10px; background: #2A2A2A; padding: 4px 8px; border-radius: 6px; color: #FF7900; margin-top: 5px; display: inline-block; border: 1px solid #333; margin-right: 5px; }
        .user-tag { font-size: 12px; color: #666; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabaseClient = window.supabase.createClient('https://phqdtypbrwxngqdjgoud.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocWR0eXBicnd4bmdxZGpnb3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNDQwMzgsImV4cCI6MjA4NjgyMDAzOH0.P69E3eB36Mcur7lmg-EWxwwwI6lKLbcDCnKXDrHDEHY');

        const STAFF = ["Steeve", "Mathieu", "Yannis", "Amaury", "Elliot", "Irvan", "Emrecan", "Ludovyk", "Johan", "Lucas", "Nico", "Jean-Max"];

        function App() {
            const [tasks, setTasks] = useState([]);
            const [text, setText] = useState('');
            const [date, setDate] = useState('');
            const [priority, setPriority] = useState('P3');
            const [selectedStaff, setSelectedStaff] = useState('');
            const [filter, setFilter] = useState('TOUS');
            const [showHistory, setShowHistory] = useState(false);
            const [currentUser, setCurrentUser] = useState(localStorage.getItem('manager_name') || '');

            useEffect(() => {
                if (!currentUser) {
                    const name = prompt("Qui utilise l'application ?");
                    if (name) { localStorage.setItem('manager_name', name); setCurrentUser(name); }
                }
                fetchTasks();
                const ch = supabaseClient.channel('db').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>fetchTasks()).subscribe();
                return () => supabaseClient.removeChannel(ch);
            }, [currentUser, showHistory]);

            async function fetchTasks() {
                const { data } = await supabaseClient.from('tasks').select('*').eq('is_done', showHistory);
                if (data) {
                    const sorted = data.sort((a, b) => {
                        // Tri par priorité P1 > P2 > P3
                        if (a.priority !== b.priority) return a.priority.localeCompare(b.priority);
                        // Puis par date d'échéance
                        if (!a.due_date) return 1;
                        if (!b.due_date) return -1;
                        return new Date(a.due_date) - new Date(b.due_date);
                    });
                    setTasks(sorted);
                }
            }

            async function handleAddTask() {
                const taskTitle = text.trim();
                if (!taskTitle) {
                    alert("Oups ! Entre un titre pour la mission.");
                    return;
                }

                const payload = {
                    text: taskTitle,
                    is_done: false,
                    assigned_to: selectedStaff || null,
                    priority: priority,
                    due_date: date || null,
                    created_by: currentUser
                };

                const { error } = await supabaseClient.from('tasks').insert([payload]);

                if (!error) {
                    setText('');
                    setDate('');
                    setPriority('P3');
                    setSelectedStaff('');
                } else {
                    alert("Erreur Supabase : " + error.message);
                }
            }

            async function toggleTask(task) {
                const now = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
                await supabaseClient.from('tasks').update({
                    is_done: !task.is_done,
                    last_updated_by: currentUser,
                    completed_at: task.is_done ? null : now
                }).eq('id', task.id);
            }

            const filteredTasks = filter === 'TOUS'
                ? tasks
                : tasks.filter(t => (t.assigned_to === filter) || (t.text.toLowerCase().includes(filter.toLowerCase())));

            return (
                <div className="container">
                    <div className="header">
                        <h2 style={{margin:0, fontSize:20}}>
                            {showHistory ? "ARCHIVES" : "MISSIONS"} <span className="orange">HUB</span>
                        </h2>
                        <div style={{display:'flex', gap:10, alignItems:'center'}}>
                            <button className="history-btn" onClick={() => setShowHistory(!showHistory)}>
                                {showHistory ? "⬅ En cours" : "📁 Archives"}
                            </button>
                            <span className="user-tag" onClick={() => { localStorage.clear(); location.reload(); }}>👤</span>
                        </div>
                    </div>

                    <div className="filter-bar">
                        <div className={`filter-chip ${filter === 'TOUS' ? 'active' : ''}`} onClick={() => setFilter('TOUS')}>Tous</div>
                        {STAFF.map(s => <div key={s} className={`filter-chip ${filter === s ? 'active' : ''}`} onClick={() => setFilter(s)}>{s}</div>)}
                    </div>

                    <div className="card">
                        {filteredTasks.length === 0 ? (
                            <div style={{textAlign:'center', color:'#666', padding:30, fontSize:14}}>
                                {showHistory ? "Historique vide." : "Aucune mission en cours."}
                            </div>
                        ) : (
                            filteredTasks.map(t => (
                                <div key={t.id} className={`task-item priority-${t.priority || 'P3'}`}>
                                    <div className={`checkbox ${t.is_done ? 'done' : ''}`} onClick={() => toggleTask(t)}>
                                        {t.is_done && "✓"}
                                    </div>
                                    <div style={{flex:1}} onClick={() => toggleTask(t)}>
                                        <div style={{
                                            fontSize:16,
                                            fontWeight:'500',
                                            textDecoration: t.is_done ? 'line-through' : 'none',
                                            color: t.is_done ? '#666' : 'white'
                                        }}>
                                            {t.text}
                                        </div>
                                        <div style={{display:'flex', flexWrap:'wrap'}}>
                                            {t.due_date && <span className="badge">📅 {new Date(t.due_date).toLocaleDateString('fr-FR')}</span>}
                                            {t.assigned_to && <span className="badge" style={{color:'#999'}}>👤 {t.assigned_to}</span>}
                                            {t.is_done && t.completed_at && <span className="badge" style={{color:'#4caf50'}}>Fait à {t.completed_at}</span>}
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    {!showHistory && (
                        <div className="footer-form">
                            <div className="input-row">
                                <input
                                    type="text"
                                    placeholder="Mission ou projet..."
                                    value={text}
                                    onChange={e => setText(e.target.value)}
                                />
                                <select style={{width:'115px'}} value={priority} onChange={e => setPriority(e.target.value)}>
                                    <option value="P1">🔴 Urgent</option>
                                    <option value="P2">🟠 Important</option>
                                    <option value="P3">⚪ Normal</option>
                                </select>
                            </div>
                            <div className="input-row">
                                <input style={{width:'145px'}} type="date" value={date} onChange={e => setDate(e.target.value)} />
                                <select
                                    value={selectedStaff}
                                    onChange={(e) => setSelectedStaff(e.target.value)}
                                >
                                    <option value="">👤 Assigner à...</option>
                                    {STAFF.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                                <button className="add-btn" onClick={handleAddTask} style={{width:'80px'}}>OK</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
