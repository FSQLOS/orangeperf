<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAGER HUB PRO</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --orange-primary: #FF7900;
            --orange-gradient: linear-gradient(135deg, #FF7900 0%, #FF9533 100%);
            --bg-dark: #0A0A0A;
            --card-bg: rgba(26, 26, 26, 0.8);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-secondary: #A0A0A0;
        }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 200px;
            letter-spacing: -0.01em;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }

        .filter-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 15px; scrollbar-width: none; }
        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-chip {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }
        .filter-chip.active {
            background: var(--orange-primary);
            border-color: var(--orange-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 121, 0, 0.3);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 10px;
            border: 1px solid var(--border-light);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border-radius: 20px;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }
        .task-item:hover { background: rgba(255, 255, 255, 0.03); transform: translateX(4px); }

        .priority-P1 { border-left: 5px solid #ff4444; }
        .priority-P2 { border-left: 5px solid var(--orange-primary); }
        .priority-P3 { border-left: 5px solid #333; }

        .checkbox {
            width: 26px; height: 26px; border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px; flex-shrink: 0; display: flex; align-items: center;
            justify-content: center; cursor: pointer; transition: all 0.2s ease;
        }
        .checkbox.done { background: var(--orange-gradient); border-color: transparent; box-shadow: 0 4px 10px rgba(255, 121, 0, 0.4); }

        .footer-form {
            position: fixed; bottom: 20px; left: 15px; right: 15px;
            background: rgba(30, 30, 30, 0.9); backdrop-filter: blur(20px);
            padding: 20px; border-radius: 30px; border: 1px solid var(--border-light);
            z-index: 100; box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }

        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input, select {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-light);
            color: white; padding: 14px; border-radius: 16px; outline: none; font-size: 15px; width: 100%;
        }

        button.add-btn {
            background: var(--orange-gradient); color: white; border: none; padding: 14px;
            border-radius: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 121, 0, 0.3);
        }
        button.history-btn { background: rgba(255,255,255,0.08); color: white; border: none; padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }

        .badge { font-size: 11px; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 8px; color: var(--text-secondary); margin-top: 6px; display: inline-block; margin-right: 8px; border: 1px solid var(--border-light); }
        .user-tag { width: 35px; height: 35px; background: var(--orange-gradient); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabaseClient = window.supabase.createClient('https://phqdtypbrwxngqdjgoud.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocWR0eXBicnd4bmdxZGpnb3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNDQwMzgsImV4cCI6MjA4NjgyMDAzOH0.P69E3eB36Mcur7lmg-EWxwwwI6lKLbcDCnKXDrHDEHY');

        const STAFF = ["Steeve", "Mathieu", "Yannis", "Amaury", "Elliot", "Irvan", "Emrecan", "Ludovyk", "Johan", "Lucas", "Nico", "Jean-Max"];
        const PUSHOVER_GROUP_KEY = "gd3eebz7m51nws4efob68zcbge5xzz";
        const PUSHOVER_API_TOKEN = "amxg1ri2x75nxx91airuhmaxs1gdo3";

        function App() {
            const [tasks, setTasks] = useState([]);
            const [text, setText] = useState('');
            const [date, setDate] = useState('');
            const [priority, setPriority] = useState('P3');
            const [selectedStaff, setSelectedStaff] = useState('');
            const [filter, setFilter] = useState('TOUS');
            const [showHistory, setShowHistory] = useState(false);
            const [currentUser, setCurrentUser] = useState(localStorage.getItem('manager_name') || '');

            useEffect(() => {
                if (!currentUser) {
                    const name = prompt("Qui utilise l'application ?");
                    if (name) { localStorage.setItem('manager_name', name); setCurrentUser(name); }
                }
                fetchTasks();
                const ch = supabaseClient.channel('db').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>fetchTasks()).subscribe();
                return () => supabaseClient.removeChannel(ch);
            }, [currentUser, showHistory]);

            async function fetchTasks() {
                const { data } = await supabaseClient.from('tasks').select('*').eq('is_done', showHistory);
                if (data) {
                    const sorted = data.sort((a, b) => {
                        if (!a.due_date) return 1;
                        if (!b.due_date) return -1;
                        return new Date(a.due_date) - new Date(b.due_date);
                    });
                    setTasks(sorted);
                }
            }

            async function handleAddTask() {
                const taskTitle = text.trim();
                if (!taskTitle) return;
                const payload = {
                    text: taskTitle,
                    is_done: false,
                    assigned_to: selectedStaff || null,
                    priority: priority,
                    due_date: date || null,
                    created_by: currentUser
                };
                const { error } = await supabaseClient.from('tasks').insert([payload]);
                if (!error) { setText(''); setDate(''); setPriority('P3'); setSelectedStaff(''); }
            }

            async function toggleTask(task) {
                const now = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
                const { error } = await supabaseClient.from('tasks').update({
                    is_done: !task.is_done,
                    last_updated_by: currentUser,
                    completed_at: task.is_done ? null : now
                }).eq('id', task.id);

                // Notification Pushover si validée
                if (!error && !task.is_done) {
                    const formData = new FormData();
                    formData.append("token", PUSHOVER_API_TOKEN);
                    formData.append("user", PUSHOVER_GROUP_KEY);
                    formData.append("title", "Checklist validée ✅");
                    formData.append("message", `${currentUser} a fini : ${task.text}`);
                    formData.append("sound", "cashregister");
                    fetch("https://api.pushover.net/1/messages.json", { method: "POST", body: formData }).catch(e => console.error(e));
                }
            }

            const filteredTasks = filter === 'TOUS' ? tasks : tasks.filter(t => (t.assigned_to === filter) || (t.text.toLowerCase().includes(filter.toLowerCase())));

            return (
                <div className="container">
                    <div className="header">
                        <h2>{showHistory ? "HISTORIQUE" : "MISSIONS"} <span className="orange">PRO</span></h2>
                        <div style={{display:'flex', gap:12, alignItems:'center'}}>
                            <button className="history-btn" onClick={() => setShowHistory(!showHistory)}>{showHistory ? "Actives" : "Archives"}</button>
                            <div className="user-tag" onClick={() => { localStorage.clear(); location.reload(); }}>{currentUser.charAt(0).toUpperCase()}</div>
                        </div>
                    </div>

                    <div className="filter-bar">
                        <div className={`filter-chip ${filter === 'TOUS' ? 'active' : ''}`} onClick={() => setFilter('TOUS')}>Tous</div>
                        {STAFF.map(s => <div key={s} className={`filter-chip ${filter === s ? 'active' : ''}`} onClick={() => setFilter(s)}>{s}</div>)}
                    </div>

                    <div className="card">
                        {filteredTasks.length === 0 ? <div style={{textAlign:'center', color:'#555', padding:40}}>Aucune mission.</div> :
                        filteredTasks.map(t => (
                            <div key={t.id} className={`task-item priority-${t.priority || 'P3'}`}>
                                <div className={`checkbox ${t.is_done ? 'done' : ''}`} onClick={() => toggleTask(t)}>{t.is_done && "✓"}</div>
                                <div style={{flex:1}}>
                                    <div style={{fontSize:16, fontWeight:'600', textDecoration: t.is_done ? 'line-through' : 'none', color: t.is_done ? '#555' : '#EEE'}}>{t.text}</div>
                                    <div>
                                        {t.due_date && <span className="badge">📅 {new Date(t.due_date).toLocaleDateString('fr-FR')}</span>}
                                        {t.assigned_to && <span className="badge">👤 {t.assigned_to}</span>}
                                        {t.is_done && t.completed_at && <span className="badge" style={{color:'#4caf50'}}>Fait à {t.completed_at}</span>}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {!showHistory && (
                        <div className="footer-form">
                            <div className="input-row">
                                <input type="text" placeholder="Mission..." value={text} onChange={e => setText(e.target.value)} />
                                <select style={{width:'120px'}} value={priority} onChange={e => setPriority(e.target.value)}>
                                    <option value="P1">🔴 Urgent</option><option value="P2">🟠 Important</option><option value="P3">⚪ Normal</option>
                                </select>
                            </div>
                            <div className="input-row">
                                <input style={{width:'150px'}} type="date" value={date} onChange={e => setDate(e.target.value)} />
                                <select value={selectedStaff} onChange={(e) => setSelectedStaff(e.target.value)}>
                                    <option value="">👤 Assigner...</option>{STAFF.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                                <button className="add-btn" onClick={handleAddTask} style={{width:'80px'}}>OK</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
