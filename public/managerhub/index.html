<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAGER HUB PRO</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --orange-primary: #FF7900;
            --orange-gradient: linear-gradient(135deg, #FF7900 0%, #FF9533 100%);
            --bg-dark: #0A0A0A;
            --card-bg: rgba(26, 26, 26, 0.8);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-secondary: #A0A0A0;
            --success-green: #4CAF50;
            --danger-red: #ff4444;
        }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 280px;
            letter-spacing: -0.01em;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 5px; }
        .header h2 { font-size: 20px; font-weight: 800; margin: 0; }

        .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-chip {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 12px;
            white-space: nowrap;
            border: 1px solid var(--border-light);
            cursor: pointer;
            color: var(--text-secondary);
        }
        .filter-chip.active { background: var(--orange-primary); border-color: var(--orange-primary); color: white; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 8px;
            border: 1px solid var(--border-light);
        }

        .task-item { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; margin-bottom: 4px; border-left: 5px solid transparent; transition: all 0.3s ease; }
        .priority-P1 { border-left-color: #ff4444; }
        .priority-P2 { border-left-color: var(--orange-primary); }
        .priority-P3 { border-left-color: #333; }

        .task-item.is-done-item { opacity: 0.7; background: rgba(76, 175, 80, 0.05); }

        .checkbox {
            width: 24px; height: 24px; border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 7px; flex-shrink: 0; display: flex; align-items: center;
            justify-content: center; cursor: pointer; font-size: 14px;
        }
        .checkbox.done { background: var(--success-green); border-color: transparent; color: white; }

        .delete-btn {
            background: rgba(255, 68, 68, 0.1);
            color: var(--danger-red);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            margin-left: 8px;
        }

        .footer-form {
            position: fixed; bottom: 15px; left: 10px; right: 10px;
            background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(25px);
            padding: 15px; border-radius: 24px; border: 1px solid var(--border-light);
            z-index: 1000; box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
        }

        .input-row { display: flex; gap: 8px; margin-bottom: 8px; }
        input, select {
            background: rgba(255, 255, 255, 0.07); border: 1px solid var(--border-light);
            color: white; padding: 12px; border-radius: 12px; font-size: 14px; outline: none;
        }

        .multi-select-container {
            display: flex; flex-wrap: wrap; gap: 6px; background: rgba(255,255,255,0.04);
            padding: 10px; border-radius: 12px; border: 1px solid var(--border-light);
            margin-bottom: 10px; max-height: 90px; overflow-y: auto;
        }
        .staff-tag {
            font-size: 11px; padding: 5px 10px; border-radius: 8px; background: #222;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
        }
        .staff-tag.selected { background: var(--orange-primary); color: white; border-color: transparent; }

        button.add-btn {
            background: var(--orange-gradient); color: white; border: none; padding: 14px;
            border-radius: 14px; font-weight: 700; cursor: pointer; width: 100%;
        }

        .badge { font-size: 10px; background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 6px; color: var(--text-secondary); margin-top: 5px; display: inline-block; border: 1px solid var(--border-light); margin-right: 5px; }
        .section-title { font-size: 11px; color: var(--orange-primary); font-weight: 800; padding: 12px 14px 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabaseClient = window.supabase.createClient('https://phqdtypbrwxngqdjgoud.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocWR0eXBicnd4bmdxZGpnb3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNDQwMzgsImV4cCI6MjA4NjgyMDAzOH0.P69E3eB36Mcur7lmg-EWxwwwI6lKLbcDCnKXDrHDEHY');

        const STAFF = ["Steeve", "Mathieu", "Yannis", "Amaury", "Elliot", "Irvan", "Emrecan", "Ludovyk", "Johan", "Lucas", "Nico", "Jean-Max"];
        const PUSHOVER_GROUP_KEY = "gd3eebz7m51nws4efob68zcbge5xzz";
        const PUSHOVER_API_TOKEN = "amxg1ri2x75nxx91airuhmaxs1gdo3";

        function App() {
            const [tasks, setTasks] = useState([]);
            const [text, setText] = useState('');
            const [date, setDate] = useState('');
            const [priority, setPriority] = useState('P3');
            const [isRecurring, setIsRecurring] = useState(false);
            const [selectedStaffs, setSelectedStaffs] = useState([]);
            const [filter, setFilter] = useState('TOUS');
            const [showHistory, setShowHistory] = useState(false);
            const [currentUser, setCurrentUser] = useState(localStorage.getItem('manager_name') || '');

            useEffect(() => {
                if (!currentUser) {
                    const name = prompt("Qui utilise l'application ?");
                    if (name) { localStorage.setItem('manager_name', name); setCurrentUser(name); }
                }
                fetchTasks();
                const ch = supabaseClient.channel('db').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>fetchTasks()).subscribe();
                return () => supabaseClient.removeChannel(ch);
            }, [currentUser, showHistory]);

            async function fetchTasks() {
                const query = supabaseClient.from('tasks').select('*');
                if (showHistory) query.eq('is_done', true);
                const { data } = await query;
                if (data) {
                    const sorted = data.sort((a, b) => {
                        if (!a.due_date && !b.due_date) return b.id - a.id;
                        if (!a.due_date) return -1;
                        if (!b.due_date) return 1;
                        return new Date(a.due_date) - new Date(b.due_date);
                    });
                    setTasks(sorted);
                }
            }

            async function deleteTask(id) {
                if (confirm("Forcer la suppression ? (Cela arrêtera la récurrence si c'en est une)")) {
                    await supabaseClient.from('tasks').delete().eq('id', id);
                }
            }

            async function handleAddTask() {
                if (!text.trim()) return;
                const payload = {
                    text: text,
                    is_done: false,
                    assigned_to: selectedStaffs.join(', ') || null,
                    priority: priority,
                    due_date: date || null,
                    created_by: currentUser,
                    is_recurring: isRecurring
                };
                const { error } = await supabaseClient.from('tasks').insert([payload]);
                if (!error) {
                    setText(''); setDate(''); setSelectedStaffs([]); setIsRecurring(false);
                }
            }

            async function toggleTask(task) {
                const now = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
                const isNowDone = !task.is_done;

                await supabaseClient.from('tasks').update({
                    is_done: isNowDone,
                    last_updated_by: currentUser,
                    completed_at: isNowDone ? now : null
                }).eq('id', task.id);

                if (isNowDone && task.is_recurring) {
                    const next = new Date(task.due_date || new Date());
                    next.setDate(next.getDate() + 7);
                    await supabaseClient.from('tasks').insert([{
                        text: task.text, is_done: false, assigned_to: task.assigned_to,
                        priority: task.priority, due_date: next.toISOString().split('T')[0],
                        created_by: "Système", is_recurring: true
                    }]);
                }

                if (isNowDone) {
                    const formData = new FormData();
                    formData.append("token", PUSHOVER_API_TOKEN);
                    formData.append("user", PUSHOVER_GROUP_KEY);
                    formData.append("message", `${currentUser} a validé : ${task.text} ✅`);
                    fetch("https://api.pushover.net/1/messages.json", { method: "POST", body: formData });
                }
            }

            const getFilteredTasks = () => {
                let base = tasks;
                const today = new Date().toISOString().split('T')[0];
                const tom = new Date(); tom.setDate(tom.getDate() + 1);
                const tomorrow = tom.toISOString().split('T')[0];

                if (showHistory) return base.filter(t => t.is_done);
                if (filter !== 'TOUS') {
                    base = base.filter(t => t.assigned_to?.includes(filter) || t.text.includes(filter));
                } else {
                    base = base.filter(t => !t.due_date || t.due_date === today || t.due_date === tomorrow);
                }
                return base.filter(t => !t.is_done || (t.is_done && (t.due_date === today || !t.due_date)));
            };

            const filteredTasks = getFilteredTasks();

            return (
                <div className="container">
                    <div className="header">
                        <h2>{showHistory ? "ARCHIVES" : "MISSIONS"} <span className="orange">PRO</span></h2>
                        <button className="history-btn" onClick={() => setShowHistory(!showHistory)}>{showHistory ? "Actives" : "Archives"}</button>
                    </div>

                    <div className="filter-bar">
                        <div className={`filter-chip ${filter === 'TOUS' ? 'active' : ''}`} onClick={() => setFilter('TOUS')}>Aujourd'hui / Demain</div>
                        {STAFF.map(s => <div key={s} className={`filter-chip ${filter === s ? 'active' : ''}`} onClick={() => setFilter(s)}>{s}</div>)}
                    </div>

                    <div className="card">
                        {filteredTasks.length === 0 ? <div style={{textAlign:'center', color:'#444', padding:40}}>Aucune mission.</div> :
                        filteredTasks.map((t, i) => {
                            const today = new Date().toISOString().split('T')[0];
                            const tom = new Date(); tom.setDate(tom.getDate() + 1);
                            const tomorrow = tom.toISOString().split('T')[0];
                            const showSection = (i === 0 || filteredTasks[i-1].due_date !== t.due_date);

                            return (
                                <React.Fragment key={t.id}>
                                    {showSection && filter === 'TOUS' && !showHistory && (
                                        <div className="section-title">
                                            {!t.due_date ? "Missions prioritaires / Fond" : t.due_date === today ? "Aujourd'hui" : t.due_date === tomorrow ? "Demain" : "À venir"}
                                        </div>
                                    )}
                                    <div className={`task-item priority-${t.priority || 'P3'} ${t.is_done ? 'is-done-item' : ''}`}>
                                        <div className={`checkbox ${t.is_done ? 'done' : ''}`} onClick={() => toggleTask(t)}>
                                            {t.is_done ? "✓" : ""}
                                        </div>
                                        <div style={{flex:1}}>
                                            <div style={{fontSize:15, fontWeight:'600', textDecoration: t.is_done ? 'line-through' : 'none', color: t.is_done ? 'var(--success-green)' : '#EEE'}}>
                                                {t.text} {t.is_recurring && "🔄"}
                                                {t.is_done && <span style={{fontSize:11, marginLeft:10, fontWeight:'normal'}}>— Terminé à {t.completed_at}</span>}
                                            </div>
                                            <div>
                                                {t.due_date && <span className="badge">📅 {new Date(t.due_date).toLocaleDateString()}</span>}
                                                {t.assigned_to && <span className="badge">👤 {t.assigned_to}</span>}
                                            </div>
                                        </div>
                                        <button className="delete-btn" onClick={() => deleteTask(t.id)}>🗑️</button>
                                    </div>
                                </React.Fragment>
                            );
                        })}
                    </div>

                    {!showHistory && (
                        <div className="footer-form">
                            <div className="input-row">
                                <input style={{flex:3}} type="text" placeholder="Titre de la mission..." value={text} onChange={e => setText(e.target.value)} />
                                <select style={{flex:1}} value={priority} onChange={e => setPriority(e.target.value)}>
                                    <option value="P1">🔴 Urgent</option><option value="P2">🟠 Important</option><option value="P3">⚪ Normal</option>
                                </select>
                            </div>
                            <div className="multi-select-container">
                                {STAFF.map(s => (
                                    <div key={s} className={`staff-tag ${selectedStaffs.includes(s) ? 'selected' : ''}`} onClick={() => setSelectedStaffs(prev => prev.includes(s) ? prev.filter(x => x !== s) : [...prev, s])}>
                                        {s}
                                    </div>
                                ))}
                            </div>
                            <div className="input-row">
                                <input style={{flex:1}} type="date" value={date} onChange={e => setDate(e.target.value)} />
                                <select style={{flex:1}} value={isRecurring ? "YES" : "NO"} onChange={e => setIsRecurring(e.target.value === "YES")}>
                                    <option value="NO">Unique</option><option value="YES">🔄 Hebdo</option>
                                </select>
                            </div>
                            <button className="add-btn" onClick={handleAddTask}>CRÉER LA MISSION</button>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
