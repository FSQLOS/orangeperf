<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manager Hub</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background: #f4f4f4; font-family: sans-serif; margin: 0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h1 { color: #FF7900; font-size: 20px; text-align: center; }
        .task { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const SUPABASE_URL = 'https://phqdtypbrwxngqdjgoud.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocWR0eXBicnd4bmdxZGpnb3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNDQwMzgsImV4cCI6MjA4NjgyMDAzOH0.P69E3eB36Mcur7lmg-EWxwwwI6lKLbcDCnKXDrHDEHY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function App() {
            const [tasks, setTasks] = useState([]);

            useEffect(() => {
                const fetchTasks = async () => {
                    const { data } = await supabaseClient.from('tasks').select('*');
                    if (data) setTasks(data);
                };
                fetchTasks();
            }, []);

            return (
                <div className="card">
                    <h1>🟠 MANAGER HUB LIVE</h1>
                    <p style={{textAlign:'center', fontSize:'12px'}}>Synchronisation Supabase Active</p>
                    {tasks.map(t => (
                        <div key={t.id} className="task">
                            <input type="checkbox" checked={t.is_done} readOnly />
                            <span>{t.text}</span>
                        </div>
                    ))}
                    {tasks.length === 0 && <p style={{textAlign:'center', color:'#999'}}>Aucune tâche en vue...</p>}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
