<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAGER HUB PRO</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --orange-primary: #FF7900;
            --orange-gradient: linear-gradient(135deg, #FF7900 0%, #FF9533 100%);
            --bg-dark: #0A0A0A;
            --card-bg: rgba(26, 26, 26, 0.8);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-secondary: #A0A0A0;
        }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 260px; /* Plus d'espace pour le formulaire agrandi */
            letter-spacing: -0.01em;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 5px; }
        .header h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }

        .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-chip {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 100px;
            font-size: 12px;
            white-space: nowrap;
            border: 1px solid var(--border-light);
            cursor: pointer;
            color: var(--text-secondary);
        }
        .filter-chip.active { background: var(--orange-primary); border-color: var(--orange-primary); color: white; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 8px;
            border: 1px solid var(--border-light);
        }

        .task-item { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; margin-bottom: 4px; }
        .priority-P1 { border-left: 5px solid #ff4444; }
        .priority-P2 { border-left: 5px solid var(--orange-primary); }
        .priority-P3 { border-left: 5px solid #333; }

        .checkbox {
            width: 24px; height: 24px; border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 7px; flex-shrink: 0; display: flex; align-items: center;
            justify-content: center; cursor: pointer;
        }
        .checkbox.done { background: var(--orange-gradient); border-color: transparent; }

        /* Footer Formulaire Corrigé */
        .footer-form {
            position: fixed; bottom: 15px; left: 10px; right: 10px;
            background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(25px);
            padding: 15px; border-radius: 24px; border: 1px solid var(--border-light);
            z-index: 1000; box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
        }

        .input-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        input, select {
            background: rgba(255, 255, 255, 0.07); border: 1px solid var(--border-light);
            color: white; padding: 12px; border-radius: 12px; outline: none; font-size: 14px; flex: 1;
            min-width: 100px;
        }

        /* Style spécifique pour l'assignation multiple */
        .multi-select-container {
            display: flex; flex-wrap: wrap; gap: 4px; background: rgba(255,255,255,0.04);
            padding: 8px; border-radius: 12px; border: 1px solid var(--border-light);
            margin-bottom: 8px; max-height: 80px; overflow-y: auto;
        }
        .staff-tag {
            font-size: 11px; padding: 4px 10px; border-radius: 6px; background: #333;
            cursor: pointer; border: 1px solid transparent;
        }
        .staff-tag.selected { background: var(--orange-primary); color: white; }

        button.add-btn {
            background: var(--orange-gradient); color: white; border: none; padding: 12px;
            border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%;
            margin-top: 5px;
        }

        .badge { font-size: 10px; background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 6px; color: var(--text-secondary); margin-top: 5px; display: inline-block; margin-right: 5px; border: 1px solid var(--border-light); }
        .section-title { font-size: 11px; color: var(--orange-primary); font-weight: 800; padding: 8px 14px 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const supabaseClient = window.supabase.createClient('https://phqdtypbrwxngqdjgoud.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocWR0eXBicnd4bmdxZGpnb3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNDQwMzgsImV4cCI6MjA4NjgyMDAzOH0.P69E3eB36Mcur7lmg-EWxwwwI6lKLbcDCnKXDrHDEHY');

        const STAFF = ["Steeve", "Mathieu", "Yannis", "Amaury", "Elliot", "Irvan", "Emrecan", "Ludovyk", "Johan", "Lucas", "Nico", "Jean-Max"];
        const PUSHOVER_GROUP_KEY = "gd3eebz7m51nws4efob68zcbge5xzz";
        const PUSHOVER_API_TOKEN = "amxg1ri2x75nxx91airuhmaxs1gdo3";

        function App() {
            const [tasks, setTasks] = useState([]);
            const [text, setText] = useState('');
            const [date, setDate] = useState('');
            const [priority, setPriority] = useState('P3');
            const [isRecurring, setIsRecurring] = useState(false);
            const [selectedStaffs, setSelectedStaffs] = useState([]); // Array pour le multi-select
            const [filter, setFilter] = useState('TOUS');
            const [showHistory, setShowHistory] = useState(false);
            const [currentUser, setCurrentUser] = useState(localStorage.getItem('manager_name') || '');

            useEffect(() => {
                if (!currentUser) {
                    const name = prompt("Qui utilise l'application ?");
                    if (name) { localStorage.setItem('manager_name', name); setCurrentUser(name); }
                }
                fetchTasks();
                const ch = supabaseClient.channel('db').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>fetchTasks()).subscribe();
                return () => supabaseClient.removeChannel(ch);
            }, [currentUser, showHistory]);

            async function fetchTasks() {
                const { data } = await supabaseClient.from('tasks').select('*').eq('is_done', showHistory);
                if (data) {
                    const sorted = data.sort((a, b) => {
                        if (!a.due_date) return 1;
                        if (!b.due_date) return -1;
                        return new Date(a.due_date) - new Date(b.due_date);
                    });
                    setTasks(sorted);
                }
            }

            const toggleStaff = (name) => {
                setSelectedStaffs(prev =>
                    prev.includes(name) ? prev.filter(s => s !== name) : [...prev, name]
                );
            };

            async function handleAddTask() {
                const taskTitle = text.trim();
                if (!taskTitle) return;

                const payload = {
                    text: taskTitle,
                    is_done: false,
                    assigned_to: selectedStaffs.join(', ') || null, // On stocke les noms séparés par une virgule
                    priority: priority,
                    due_date: date || null,
                    created_by: currentUser,
                    is_recurring: isRecurring
                };

                const { error } = await supabaseClient.from('tasks').insert([payload]);
                if (!error) {
                    setText(''); setDate(''); setPriority('P3'); setSelectedStaffs([]); setIsRecurring(false);
                } else {
                    alert("Erreur d'ajout : " + error.message);
                }
            }

            async function toggleTask(task) {
                const now = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
                const { error } = await supabaseClient.from('tasks').update({
                    is_done: !task.is_done,
                    last_updated_by: currentUser,
                    completed_at: task.is_done ? null : now
                }).eq('id', task.id);

                if (!error && !task.is_done) {
                    if (task.is_recurring) {
                        const nextDate = new Date(task.due_date || new Date());
                        nextDate.setDate(nextDate.getDate() + 7);
                        await supabaseClient.from('tasks').insert([{
                            text: task.text, is_done: false, assigned_to: task.assigned_to,
                            priority: task.priority, due_date: nextDate.toISOString().split('T')[0],
                            created_by: "Système", is_recurring: true
                        }]);
                    }
                    const formData = new FormData();
                    formData.append("token", PUSHOVER_API_TOKEN);
                    formData.append("user", PUSHOVER_GROUP_KEY);
                    formData.append("title", "Mission accomplie ✅");
                    formData.append("message", `${currentUser} a fini : ${task.text}`);
                    formData.append("sound", "cashregister");
                    fetch("https://api.pushover.net/1/messages.json", { method: "POST", body: formData }).catch(e => console.error(e));
                }
            }

            const getFilteredTasks = () => {
                const today = new Date().toISOString().split('T')[0];
                const tomDate = new Date(); tomDate.setDate(tomDate.getDate() + 1);
                const tomorrow = tomDate.toISOString().split('T')[0];

                if (filter !== 'TOUS') {
                    return tasks.filter(t => t.assigned_to?.includes(filter) || t.text.toLowerCase().includes(filter.toLowerCase()));
                }
                if (!showHistory) {
                    return tasks.filter(t => !t.due_date || t.due_date === today || t.due_date === tomorrow);
                }
                return tasks;
            };

            const filteredTasks = getFilteredTasks();

            return (
                <div className="container">
                    <div className="header">
                        <h2>{showHistory ? "ARCHIVES" : "MISSIONS"} <span className="orange">PRO</span></h2>
                        <button className="history-btn" onClick={() => setShowHistory(!showHistory)}>{showHistory ? "Actives" : "Archives"}</button>
                    </div>

                    <div className="filter-bar">
                        <div className={`filter-chip ${filter === 'TOUS' ? 'active' : ''}`} onClick={() => setFilter('TOUS')}>Aujourd'hui / Demain</div>
                        {STAFF.map(s => <div key={s} className={`filter-chip ${filter === s ? 'active' : ''}`} onClick={() => setFilter(s)}>{s}</div>)}
                    </div>

                    <div className="card">
                        {filteredTasks.length === 0 ? <div style={{textAlign:'center', color:'#555', padding:30}}>Aucune mission.</div> :
                        filteredTasks.map((t, index) => {
                            const today = new Date().toISOString().split('T')[0];
                            const tomDate = new Date(); tomDate.setDate(tomDate.getDate() + 1);
                            const tomorrow = tomDate.toISOString().split('T')[0];
                            let label = (index === 0 || tasks[index-1].due_date !== t.due_date) ? true : false;

                            return (
                                <React.Fragment key={t.id}>
                                    {label && filter === 'TOUS' && !showHistory && (
                                        <div className="section-title">
                                            {t.due_date === today ? "Aujourd'hui" : t.due_date === tomorrow ? "Demain" : "Missions de fond"}
                                        </div>
                                    )}
                                    <div className={`task-item priority-${t.priority || 'P3'}`}>
                                        <div className={`checkbox ${t.is_done ? 'done' : ''}`} onClick={() => toggleTask(t)}>{t.is_done && "✓"}</div>
                                        <div style={{flex:1}}>
                                            <div style={{fontSize:15, fontWeight:'600', color: t.is_done ? '#555' : '#EEE'}}>{t.text} {t.is_recurring && "🔄"}</div>
                                            <div>
                                                {t.due_date && <span className="badge">📅 {new Date(t.due_date).toLocaleDateString()}</span>}
                                                {t.assigned_to && <span className="badge">👤 {t.assigned_to}</span>}
                                            </div>
                                        </div>
                                    </div>
                                </React.Fragment>
                            );
                        })}
                    </div>

                    {!showHistory && (
                        <div className="footer-form">
                            <div className="input-row">
                                <input type="text" placeholder="Titre de la mission..." value={text} onChange={e => setText(e.target.value)} />
                                <select style={{width:'100px'}} value={priority} onChange={e => setPriority(e.target.value)}>
                                    <option value="P1">🔴 Urgent</option><option value="P2">🟠 Important</option><option value="P3">⚪ Normal</option>
                                </select>
                            </div>

                            <div className="multi-select-container">
                                {STAFF.map(s => (
                                    <div key={s} className={`staff-tag ${selectedStaffs.includes(s) ? 'selected' : ''}`} onClick={() => toggleStaff(s)}>
                                        {s}
                                    </div>
                                ))}
                            </div>

                            <div className="input-row">
                                <input style={{flex:2}} type="date" value={date} onChange={e => setDate(e.target.value)} />
                                <select style={{flex:1}} value={isRecurring ? "YES" : "NO"} onChange={e => setIsRecurring(e.target.value === "YES")}>
                                    <option value="NO">Unique</option><option value="YES">🔄 Hebdo</option>
                                </select>
                            </div>
                            <button className="add-btn" onClick={handleAddTask}>AJOUTER LA MISSION</button>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
